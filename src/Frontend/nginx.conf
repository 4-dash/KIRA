server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Crucial for React Router: Redirects 404s back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets like JS/CSS forever since they have hashes
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}