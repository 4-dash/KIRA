version: "3.9"

services:
  otp:
    image: opentripplanner/opentripplanner:2.8.1
    working_dir: /var/opentripplanner
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx20g"
    volumes:
      - ./otp-data:/var/opentripplanner
    command: ["--load", "--serve"]
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - bootstrap.system_call_filter=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OTP_URL=http://otp:8080/otp/routers/default/index/graphql
    depends_on:
      - opensearch
      - otp
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
        context: ./Frontend
        dockerfile: Dockerfile
    environment:
        - VITE_WS_URL=ws://localhost:8000/chat
    depends_on:
        - backend
    ports:
        - "5173:5173"

  # Ingestion toolbox container (does NOT auto-run ingestor_v2).
  # Use:
  #   docker compose --profile ingest run --rm ingester python ingestor_v2.py
  ingester:
    profiles: ["ingest"]
    build:
      context: ./Backend/Ingester
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OTP_URL=http://otp:8080/otp/routers/default/index/graphql
      - BAYERNCLOUD_DATA_DIR=/data/bayerncloud
    volumes:
      - bc-data:/data/bayerncloud
    depends_on:
      - opensearch
    command: ["sleep", "infinity"]
    restart: "no"

  # BayernCloud fetcher (optional): downloads BayernCloud JSON into the shared bc-data volume.
  # Use:
  #   docker compose --profile ingest run --rm bayerncloud-fetch
  bayerncloud-fetch:
    profiles: ["ingest"]
    build:
      context: ./Backend/Ingester
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BAYERNCLOUD_DATA_DIR=/data/bayerncloud
    volumes:
      - bc-data:/data/bayerncloud
    command: ["python", "bayerncloud_fetch.py"]
    restart: "no"

volumes:
  opensearch-data:
  bc-data:
