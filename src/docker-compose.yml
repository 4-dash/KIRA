
services:
  otp:
    image: opentripplanner/opentripplanner:2.8.1
    working_dir: /var/opentripplanner
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx10g"
    volumes:
      - ./otp-data:/var/opentripplanner
    command: ["--load", "--serve"]
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - bootstrap.memory_lock=true
      - bootstrap.system_call_filter=false
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboard
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      - opensearch

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OTP_URL=http://otp:8080/otp/routers/default/index/graphql
    depends_on:
      otp:
        condition: service_started
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
        context: ./Frontend
        dockerfile: Dockerfile
    depends_on:
        - backend
    restart: unless-stopped

  # Ingestion toolbox container (does NOT auto-run ingestor_v2).
  # Use:
  #   docker-compose --profile ingest run --rm ingester python ingestor_v2.py
  ingester:
    profiles: ["ingest"]
    build:
      context: ./Backend/Ingester
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OTP_URL=http://otp:8080/otp/routers/default/index/graphql
      - BAYERNCLOUD_DATA_DIR=/data/bayerncloud
      - GNTB_DATA_DIR=/data/gntb
    volumes:
      - bc-data:/data/bayerncloud
      - gntb-data:/data/gntb
    depends_on:
      - opensearch
    command: ["sleep", "infinity"]
    restart: "no"

  # BayernCloud fetcher (optional): downloads BayernCloud JSON into the shared bc-data volume.
  # Use:
  #   docker-compose --profile ingest run --rm bayerncloud-fetch
  bayerncloud-fetch:
    profiles: ["ingest"]
    build:
      context: ./Backend/Ingester
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - BAYERNCLOUD_DATA_DIR=/data/bayerncloud
      - GNTB_DATA_DIR=/data/gntb
    volumes:
      - bc-data:/data/bayerncloud
      - gntb-data:/data/gntb
    command: ["python", "bayerncloud_fetch.py"]
    restart: "no"

  # GNTB fetch + transform (optional): downloads DZT/GNTB KG JSON and writes
  # normalized gntb_clean.json into the shared gntb-data volume.
  # Use:
  #   docker-compose --profile ingest run --rm gntb-fetch-transform
  gntb-fetch-transform:
    profiles: ["ingest"]
    build:
      context: ./Backend/Ingester
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - GNTB_DATA_DIR=/data/gntb
    volumes:
      - gntb-data:/data/gntb
    command: ["bash", "-lc", "python gntb_fetch_allgaeu.py && python gntb_transform.py"]
    restart: "no"

volumes:
  opensearch-data:
  bc-data:
  gntb-data:
